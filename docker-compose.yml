services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
        VITE_USE_MOCKS: ${VITE_USE_MOCKS:-false}
    ports:
      - '${FRONTEND_PORT:-8080}:8080'
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/proshop
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      NODE_ENV: production
      ENABLE_DOCS: ${ENABLE_DOCS:-true}
    ports:
      - '4000:4000'
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8
    # Solo en localhost: Mongo no tiene autenticación en local
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
